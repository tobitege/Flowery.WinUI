name: Flowery.WinUI CI

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Generate and verify documentation
        run: |
          set -euo pipefail
          python Utils/generate_docs.py
          python Utils/generate_site.py
          test -s docs/index.html
          test -s docs/home.html
          test -s docs/style.css

  # Mirrors the release build-library job so packaging breaks surface in PRs.
  build-library:
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.402
      - name: Create NuGet package
        run: ./scripts/build_nuget.ps1 -Configuration Release -OutputDir ./artifacts -SdkVersion '10.0.402'
      - name: Run native Windows tests
        run: ./scripts/test_windows.ps1 -Configuration Release -SdkVersion '10.0.402' -SkipBuild
      - name: Run native Kiosk tests
        run: ./scripts/test_kiosk.ps1 -Configuration Release -SdkVersion '10.0.402' -SkipBuild

  # Mirrors the release build-gallery job so self-contained publishing is verified in PRs.
  build-gallery:
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.402
      - name: Publish Gallery App (Windows)
        run: ./scripts/publish_windows.ps1 -Configuration Release -RuntimeIdentifier win-x64 -SelfContained:$true -OutputDir publish -SdkVersion '10.0.402'
      - name: Publish Kiosk App (Windows, NativeAOT)
        run: ./scripts/publish_windows.ps1 -Application Kiosk -Configuration Release -Aot -OutputDir publish-kiosk -SdkVersion '10.0.402'
      - name: Run native Kiosk tests on the NativeAOT build
        run: ./scripts/test_kiosk.ps1 -Configuration Release -ExecutablePath ./publish-kiosk/Flowery.WinUI.Kiosk.exe
      - name: Publish Photos App (Windows, NativeAOT)
        run: ./scripts/publish_windows.ps1 -Application Photos -Configuration Release -Aot -OutputDir publish-photos -SdkVersion '10.0.402'
      - name: Start the NativeAOT Photos
        run: ./scripts/test_photos_start.ps1 -ExecutablePath ./publish-photos/Flowery.WinUI.Photos.exe

  windows:
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        sdk:
          - version: '10.0.402'
            quality: ga
            name: net10
          - version: '11.0.100-rc.2.26504.105'
            quality: preview
            name: net11-rc2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.402
            ${{ matrix.sdk.version }}
          dotnet-quality: ${{ matrix.sdk.quality }}
      - name: Build native Windows solution
        shell: pwsh
        run: ./scripts/build_all.ps1 -Configuration ${{ matrix.configuration }} -SdkVersion '${{ matrix.sdk.version }}' -NoRun
      - name: Run native Windows tests
        shell: pwsh
        run: ./scripts/test_windows.ps1 -Configuration ${{ matrix.configuration }} -SdkVersion '${{ matrix.sdk.version }}' -SkipBuild
      - name: Run native Kiosk tests
        shell: pwsh
        run: ./scripts/test_kiosk.ps1 -Configuration ${{ matrix.configuration }} -SdkVersion '${{ matrix.sdk.version }}' -SkipBuild
      - name: Run the Gallery smoke run
        shell: pwsh
        run: ./scripts/test_gallery_smoke.ps1 -Configuration ${{ matrix.configuration }} -SkipBuild
      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Flowery.WinUI-windows-${{ matrix.sdk.name }}-${{ matrix.configuration }}-results
          path: |
            logs/
            TestResults/
          if-no-files-found: ignore
