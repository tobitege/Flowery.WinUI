name: Flowery.WinUI Release

# MANUAL TRIGGER ONLY - Creates a new release with NuGet package, Gallery, Kiosk and Photos apps
# Go to Actions → Flowery.WinUI Release → Run workflow → Enter version (e.g., 0.1.0)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0) - without "v" prefix'
        required: true
        type: string
      sdk_version:
        description: '.NET SDK used for the native Windows build'
        required: true
        type: choice
        options:
          - '10.0.402'
          - '11.0.100-rc.2.26504.105'
        default: '10.0.402'
      skip_nuget:
        description: 'Skip NuGet publish (useful for re-running failed releases)'
        required: false
        type: boolean
        default: false
      skip_tag:
        description: 'Skip tag creation (assumes you already pushed the tag manually)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - name: Validate version format
        id: validate
        run: |
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format. Use semantic versioning (e.g., 0.1.0)"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Version: $VERSION, Tag: v$VERSION"

  build-library:
    needs: validate
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.402
            ${{ inputs.sdk_version }}

      - name: Verify version from evaluated MSBuild properties
        run: |
          $project = 'Flowery.WinUI/Flowery.WinUI.csproj'
          $arguments = @('msbuild', $project, '-nologo', '-getProperty:Version')
          $version = (& dotnet @arguments | Select-Object -Last 1).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne '${{ needs.validate.outputs.version }}') {
            throw "Version mismatch: project version $version."
          }

      - name: Create NuGet package
        run: ./scripts/build_nuget.ps1 -Configuration Release -OutputDir ./artifacts -SdkVersion '${{ inputs.sdk_version }}'

      - name: Run native Windows tests
        run: ./scripts/test_windows.ps1 -Configuration Release -SkipBuild
      - name: Run native Kiosk tests
        run: ./scripts/test_kiosk.ps1 -Configuration Release -SkipBuild

      - name: Create library zip
        run: |
          $libraryOutput = './bin/Release/Flowery.WinUI/net10.0-windows10.0.19041/win-x64'
          Compress-Archive -Path "$libraryOutput/*" -DestinationPath './artifacts/Flowery.WinUI-lib.zip'

      - name: Upload library artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Flowery.WinUI-library-artifacts
          path: |
            ./artifacts/*.nupkg
            ./artifacts/Flowery.WinUI-lib.zip
          if-no-files-found: error

  build-gallery:
    needs: [validate, build-library]
    runs-on: windows-2025-vs2026
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.402
            ${{ inputs.sdk_version }}

      - name: Publish Gallery App (Windows)
        shell: pwsh
        run: |
          ./scripts/publish_windows.ps1 `
            -Configuration Release `
            -RuntimeIdentifier win-x64 `
            -SelfContained:$true `
            -OutputDir publish `
            -SdkVersion '${{ inputs.sdk_version }}'

      - name: Zip Windows artifact
        run: Compress-Archive -Path ./publish/* -DestinationPath ./Flowery.WinUI.Gallery-Windows-x64.zip
        shell: pwsh

      - name: Publish Kiosk App (Windows, NativeAOT)
        shell: pwsh
        run: ./scripts/publish_windows.ps1 -Application Kiosk -Configuration Release -Aot -OutputDir publish-kiosk -SdkVersion '${{ inputs.sdk_version }}'

      - name: Run native Kiosk tests on the NativeAOT build
        shell: pwsh
        run: ./scripts/test_kiosk.ps1 -Configuration Release -ExecutablePath ./publish-kiosk/Flowery.WinUI.Kiosk.exe

      - name: Zip Kiosk artifact
        shell: pwsh
        run: Compress-Archive -Path ./publish-kiosk/* -DestinationPath ./Flowery.WinUI.Kiosk-Windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Flowery.WinUI.Gallery-Windows-x64
          path: ./Flowery.WinUI.Gallery-Windows-x64.zip

      - name: Upload Kiosk artifact
        uses: actions/upload-artifact@v7
        with:
          name: Flowery.WinUI.Kiosk-Windows-x64
          path: ./Flowery.WinUI.Kiosk-Windows-x64.zip

  build-photos:
    needs: [validate, build-library]
    runs-on: windows-2025-vs2026
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.402
            ${{ inputs.sdk_version }}

      - name: Publish Photos App (Windows, NativeAOT)
        run: ./scripts/publish_windows.ps1 -Application Photos -Configuration Release -Aot -OutputDir publish-photos -SdkVersion '${{ inputs.sdk_version }}'

      - name: Zip Photos artifact
        run: |
          New-Item -ItemType Directory -Path ./final -Force | Out-Null
          Compress-Archive -Path ./publish-photos/* -DestinationPath ./final/Flowery.WinUI.Photos-Windows-x64.zip

      - name: Build Photos NSIS installer
        run: |
          $nsis = ./scripts/get_nsis.ps1 -Directory "$env:RUNNER_TEMP/Flowery/Tools"
          ./scripts/build_photos_installer.ps1 -AppDirectory publish-photos -OutputDirectory final -NsisPath $nsis -Version '${{ needs.validate.outputs.version }}'

      - name: Test Photos per-user installer
        run: ./scripts/test_photos_installer.ps1 -InstallerPath 'final/Flowery.WinUI.Photos-Setup-${{ needs.validate.outputs.version }}-x64.exe' -AppDirectory publish-photos -OutputDirectory "$env:RUNNER_TEMP/Flowery/Tests/PhotosInstaller" -ExpectedVersion '${{ needs.validate.outputs.version }}'

      - name: Upload Photos artifact
        uses: actions/upload-artifact@v7
        with:
          name: Flowery.WinUI.Photos-Windows-x64
          path: |
            ./final/Flowery.WinUI.Photos-Windows-x64.zip
            ./final/Flowery.WinUI.Photos-Setup-*-x64.exe
          if-no-files-found: error

  publish:
    needs: [validate, build-library, build-gallery, build-photos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.402
            ${{ inputs.sdk_version }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./release-artifacts

      - name: Collect artifacts
        run: |
          mkdir -p ./final
          find ./release-artifacts -name "*.nupkg" -exec cp {} ./final/ \; || true
          find ./release-artifacts -name "*.zip" -exec cp {} ./final/ \;
          find ./release-artifacts -name "Flowery.WinUI.Photos-Setup-*-x64.exe" -exec cp {} ./final/ \;
          echo "=== Release artifacts ==="
          ls -la ./final/

      - name: Create checksums
        working-directory: ./final
        run: |
          sha256sum -- * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt ./SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Signed build provenance for every release asset, verifiable with `gh attestation verify`.
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: './final/*'

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          # Extract the section for this version from CHANGELOG.md
          CHANGELOG=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]") found=1
            }
            found && !/^## \[/ { print }
          ' CHANGELOG.md)

          if [ -z "$CHANGELOG" ]; then
            echo "⚠️ No changelog entry found for version $VERSION"
            CHANGELOG="No changelog entry for this version."
          fi

          echo "$CHANGELOG" > changelog_section.md
          echo "✅ Extracted changelog for v$VERSION"

      - name: NuGet login
        if: ${{ inputs.skip_nuget != true }}
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: tobitege

      - name: Publish to NuGet
        if: ${{ inputs.skip_nuget != true }}
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NuGet login did not return an API key."
            exit 1
          fi

          shopt -s nullglob
          packages=(./final/*.nupkg)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::No .nupkg files found in ./final. Check the pack/upload/download steps."
            exit 1
          fi

          for pkg in "${packages[@]}"; do
            echo "Publishing $pkg"
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_API_KEY" \
              --source "https://api.nuget.org/v3/index.json" \
              --skip-duplicate
          done

          echo "✅ Published to NuGet.org"

      - name: Create and push tag
        if: ${{ inputs.skip_tag != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ needs.validate.outputs.tag }}
          git push origin ${{ needs.validate.outputs.tag }}
          echo "✅ Created tag: ${{ needs.validate.outputs.tag }}"

      - name: Skip tag creation
        if: ${{ inputs.skip_tag == true }}
        run: echo "⏭️ Skipping tag creation (tag already exists)"

      - name: Build release notes
        run: |
          cat > release_notes.md << 'HEADER'
          ## 📋 What's Changed
          HEADER
          cat changelog_section.md >> release_notes.md
          cat >> release_notes.md << 'FOOTER'

          ---

          ## 📦 Library

          | Asset | Description |
          |-------|-------------|
          FOOTER

          echo "| \`Flowery.WinUI.${{ needs.validate.outputs.version }}.nupkg\` | NuGet package (also on [nuget.org](https://www.nuget.org/packages/Flowery.WinUI)) |" >> release_notes.md
          echo "| \`Flowery.WinUI-lib.zip\` | Compiled DLL and PDB |" >> release_notes.md

          cat >> release_notes.md << 'GALLERY'

          ## 🌸 Gallery Demo App

          Self-contained executable for demoing Flowery.WinUI controls (no .NET install required).

          | Platform | Download |
          |----------|----------|
          | Windows x64 | `Flowery.WinUI.Gallery-Windows-x64.zip` |
          | Windows x64 Kiosk | `Flowery.WinUI.Kiosk-Windows-x64.zip` |
          GALLERY

          cat >> release_notes.md << 'PHOTOS'

          ## 🖼️ Flowery Photos

          Photo viewer and editor built with Flowery.WinUI (no .NET or Windows App SDK install required). The per-user installer adds a Start menu entry and an uninstaller. Alternatively, extract the portable ZIP and keep all its files together.

          | Asset | Description |
          |-------|-------------|
          PHOTOS

          echo "| \`Flowery.WinUI.Photos-Setup-${{ needs.validate.outputs.version }}-x64.exe\` | Per-user installer (Windows x64) |" >> release_notes.md
          echo "| \`Flowery.WinUI.Photos-Windows-x64.zip\` | Portable app (Windows x64); run \`Flowery.WinUI.Photos.exe\` |" >> release_notes.md

          cat >> release_notes.md << 'VERIFY'

          ## 🔐 Verify downloads

          This workflow built every asset above and attested its build provenance. To check that a file comes from this repository and release build:

          ```
          gh attestation verify <file> --repo ${{ github.repository }}
          ```

          `SHA256SUMS.txt` lists the SHA-256 checksum of every asset; check all of them with `sha256sum -c SHA256SUMS.txt`, or one file in PowerShell with `Get-FileHash <file>`. The packages on nuget.org carry nuget.org's repository signature, so their checksums differ from the release assets.
          VERIFY

          echo "=== Release Notes ==="
          cat release_notes.md

      - name: Load custom release notes
        id: release_body
        run: |
          {
            echo 'body<<EOF'
            cat release_notes.md
            echo ''
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: "v${{ needs.validate.outputs.version }}"
          files: ./final/*
          generate_release_notes: true
          body: ${{ steps.release_body.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## 🎉 Release Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** ${{ needs.validate.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **NuGet:** https://www.nuget.org/packages/Flowery.WinUI/${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Release:** ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.validate.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
